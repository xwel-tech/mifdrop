<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIFDROP — Кейсы</title>
  <style>
    /* --- Дизайн в стиле MIFDROP --- */
    body {
      background-color: #060913;
      color: #f1f5f9;
      font-family: 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 12px;
    }
    .bulldrop-app {
      max-width: 1500px;
      margin: 0 auto;
      background: #0b0f19;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.03);
      box-sizing: border-box;
    }
    /* Шапка сайта */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #141b2d;
      flex-wrap: wrap;
      gap: 10px;
    }
    .logo-block {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon { font-size: 1.8rem; }
    .logo-text {
      font-size: 1.3rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffaa00, #ff5500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* Кнопка открытия инвентаря в шапке */
    .inv-toggle-btn {
      background: #141b2d;
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.05);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .inv-toggle-btn:hover {
      background: #1a233a;
      color: #f1f5f9;
      border-color: #ffaa00;
    }
    .right-header-block {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    /* Виджет баланса */
    .balance-box {
      background: #111726;
      border: 1px solid rgba(255, 170, 0, 0.2);
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 800;
      color: #ffaa00;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 10px rgba(255, 170, 0, 0.05);
    }
    /* Экраны */
    .screen { display: none; }
    .screen.active { display: block; }
    /* Сетка кейсов */
    .cases-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .case-card {
      background: #111726;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.04);
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .case-card:hover { transform: translateY(-3px); border-color: #ffaa00; }
    .case-img {
      height: 90px;
      background: radial-gradient(circle, #1a233a 0%, #111726 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      margin-bottom: 10px;
    }
    .case-name { font-size: 0.95rem; font-weight: 700; margin: 0 0 4px 0; }
    .case-price { color: #ffaa00; font-weight: 800; font-size: 0.9rem; }
    /* Экран Рулетки и Кнопки */
    .back-btn {
      background: #141b2d;
      color: #94a3b8;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.8rem;
      margin-bottom: 15px;
      text-transform: uppercase;
    }
    .roulette-container {
      background: #111726;
      border-radius: 12px;
      padding: 20px 12px;
      text-align: center;
    }
    /* Окно самой ленты */
    .tape-window {
      position: relative;
      width: 100%;
      height: 90px;
      background: #060913;
      border-radius: 8px;
      overflow: hidden;
      margin: 20px 0;
      border: 1px solid #141b2d;
    }
    /* Стрелка по центру рулетки */
    .tape-pointer {
      position: absolute;
      top: 0; left: 50%;
      width: 4px; height: 100%;
      background: #ff5500;
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 0 8px #ff5500;
    }
    .tape-track {
      display: flex;
      position: absolute;
      left: 0; top: 5px;
      height: 80px;
      will-change: transform;
    }
    .tape-item {
      width: 76px;
      height: 80px;
      background: #1a233a;
      margin: 0 3px;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-sizing: border-box;
      border-bottom: 4px solid #64748b;
    }
    .open-btn {
      background: linear-gradient(90deg, #ffaa00, #ff5500);
      color: #000;
      border: none;
      padding: 12px 30px;
      font-weight: 800;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
      transition: all 0.3s;
    }
    .open-btn:disabled {
      background: #272e3f;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }
    /* Экран выигрыша */
    .win-box { display: none; margin-top: 15px; padding: 15px; border-radius: 10px; }
    .win-icon { font-size: 2.4rem; margin-bottom: 6px; }
    .win-title { font-size: 1.2rem; font-weight: 800; margin: 8px 0; }
    .win-rarity { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    /* Кнопки действий при выигрыше */
    .win-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .sell-btn {
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-weight: 800;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(0, 114, 255, 0.2);
      transition: all 0.2s;
    }
    .sell-btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
    .keep-btn {
      background: #141b2d;
      color: #f1f5f9;
      border: 1px solid rgba(255,255,255,0.05);
      padding: 10px 20px;
      font-weight: 800;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .keep-btn:hover { background: #1a233a; }
    /* БЛОК СОДЕРЖИМОГО КЕЙСА */
    .case-preview-section {
      margin-top: 25px;
      text-align: left;
    }
    .preview-title {
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 1px;
      margin-bottom: 10px;
      padding-left: 4px;
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .preview-item {
      background: #111726;
      border: 1px solid rgba(255,255,255,0.02);
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
      box-sizing: border-box;
      border-bottom: 3px solid #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .preview-icon { font-size: 1.4rem; margin-bottom: 4px; }
    .preview-name { font-size: 0.65rem; font-weight: 700; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }

    /* СТИЛИ ДЛЯ ЭКРАНА ИНВЕНТАРЯ */
    .inventory-container {
      background: #111726;
      border-radius: 12px;
      padding: 20px 16px;
    }
    .inventory-empty-text {
      color: #64748b;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 40px 0;
    }
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .inv-sell-btn {
      background: linear-gradient(90deg, #ffaa00, #ff5500);
      color: #000;
      border: none;
      padding: 4px 8px;
      font-weight: 800;
      font-size: 0.65rem;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 6px;
      text-transform: uppercase;
      width: 100%;
      transition: transform 0.1s;
    }
    .inv-sell-btn:hover {
      transform: scale(1.03);
    }

    /* СТИЛИ ДЛЯ ЭКРАНА АПГРЕЙДА */
    .upg-pick-item {
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .upg-pick-item:hover {
      transform: translateY(-2px);
    }
    .upg-back-link {
      cursor: pointer;
    }
    .upg-back-link:hover { color: #ffaa00; }
    .upgrade-compare {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 18px 0 6px 0;
      flex-wrap: wrap;
    }
    .upgrade-slot {
      flex: 1;
      min-width: 110px;
      max-width: 150px;
      background: #0b0f19;
      border-radius: 10px;
      padding: 14px 8px;
      border-bottom: 3px solid #64748b;
      box-sizing: border-box;
    }
    .upgrade-slot-icon { font-size: 2rem; margin-bottom: 6px; }
    .upgrade-slot-name {
      font-size: 0.78rem;
      font-weight: 700;
      color: #f1f5f9;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .upgrade-slot-price { font-size: 0.75rem; font-weight: 800; margin-top: 4px; }
    .upgrade-arrow-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 70px;
    }
    .upgrade-arrow { font-size: 1.4rem; color: #64748b; }
    .upgrade-multiplier { font-size: 1rem; font-weight: 800; color: #ffaa00; }
    .upgrade-chance { font-size: 0.75rem; color: #94a3b8; font-weight: 700; }
    .upgrade-meter {
      position: relative;
      width: 100%;
      height: 30px;
      border-radius: 8px;
      overflow: hidden;
      margin: 18px 0 18px 0;
      display: flex;
      background: #060913;
      border: 1px solid #141b2d;
    }
    .upgrade-meter-win { height: 100%; background: linear-gradient(90deg, #16c784, #0f9d68); }
    .upgrade-meter-lose { height: 100%; background: #272e3f; flex: 1; }
    .upgrade-needle {
      position: absolute;
      top: -4px;
      width: 4px;
      height: 38px;
      background: #fff;
      left: 0%;
      transform: translateX(-50%);
      box-shadow: 0 0 8px rgba(255,255,255,0.8);
      border-radius: 2px;
    }
    @media (max-width: 420px) {
      .inv-toggle-btn { padding: 6px 9px; font-size: 0.75rem; }
      .right-header-block { gap: 8px; }
      .balance-box { padding: 6px 10px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
<div class="bulldrop-app">
  <!-- Шапка -->
  <div class="header">
    <div class="logo-block">
      <span class="logo-icon">🐂</span>
      <span class="logo-text">MIFDROP</span>
    </div>
    <div class="right-header-block">
      <button class="inv-toggle-btn" id="invBtn" onclick="goToInventory()">🎒 Инвентарь</button>
      <button class="inv-toggle-btn" id="upgBtn" onclick="goToUpgrade()">⚡ Апгрейд</button>
      <div class="balance-box">
        <span id="balanceValue">1000</span><span>G</span>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 1: Главная страница с каталогом кейсов -->
  <div class="screen active" id="catalogScreen">
    <div class="cases-grid">
      <div class="case-card" onclick="goToRoulette('fable')">
        <div class="case-img">📦</div>
        <h3 class="case-name">Fable Case</h3>
        <span class="case-price">100 G</span>
      </div>
      <div class="case-card" onclick="goToRoulette('scorpion')">
        <div class="case-img">🦂</div>
        <h3 class="case-name">Scorpion Case</h3>
        <span class="case-price">120 G</span>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 2: Страница с рулеткой -->
  <div class="screen" id="rouletteScreen">
    <button class="back-btn" onclick="goToCatalog()">← Назад к кейсам</button>
    <div class="roulette-container">
      <h2 id="caseTitle" style="margin:0; font-size:1.2rem; text-transform:uppercase;">Открытие кейса</h2>
      <div id="spinArea">
        <div class="tape-window">
          <div class="tape-pointer"></div>
          <div class="tape-track" id="tapeTrack"></div>
        </div>
        <button class="open-btn" id="startBtn" onclick="spinRoulette()">Открыть кейс</button>
      </div>
      <div class="win-box" id="winBox">
        <div class="win-icon" id="winIcon">🎁</div>
        <div class="win-title" id="winTitle">Название скина</div>
        <div class="win-rarity" id="winRarity">Редкость</div>
        <div class="win-actions">
          <button class="sell-btn" id="sellBtn" onclick="sellCurrentSkin()">Продать за -- G</button>
          <button class="keep-btn" onclick="keepCurrentSkin()">Оставить</button>
        </div>
      </div>
    </div>
    <div class="case-preview-section" id="previewSection">
      <div class="preview-title">Содержимое кейса</div>
      <div class="preview-grid" id="previewGrid"></div>
    </div>
  </div>

  <!-- ЭКРАН 3: Страница Инвентаря -->
  <div class="screen" id="inventoryScreen">
    <button class="back-btn" onclick="goToCatalog()">← Назад к кейсам</button>
    <div class="inventory-container">
      <h2 style="margin:0 0 15px 0; font-size:1.2rem; text-transform:uppercase;">Ваш инвентарь</h2>
      <div id="inventoryContent">
        <div class="inventory-empty-text">Ваш инвентарь пуст. Откройте кейсы, чтобы выбить скины!</div>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 4: Страница Апгрейда -->
  <div class="screen" id="upgradeScreen">
    <button class="back-btn" onclick="goToCatalog()">← Назад к кейсам</button>
    <div class="roulette-container">
      <h2 style="margin:0 0 15px 0; font-size:1.2rem; text-transform:uppercase;">Апгрейд предметов</h2>
      <div id="upgradeContent"></div>
    </div>
  </div>

</div> <!-- Конец основного контейнера .bulldrop-app -->

<script>
  // Состояние приложения
  let balance = 1000;
  let myInventory = [];
  let currentCase = null;
  let currentWonSkin = null;
  let running = false;

  // Состояние апгрейда
  const HOUSE_EDGE = 0.9; // даёт площадке небольшое преимущество, как на реальных сайтах
  let upgradeRunning = false;
  let upgradeSourceIndex = null;
  let upgradeSourceItem = null;
  let upgradeTargetItem = null;
  let currentUpgradeChance = 0;

  // Конфигурация редкостей предметов
  const rarityInfo = {
    rare: { name: 'Rare', color: '#4b69ff', sellPrice: 20 },
    epic: { name: 'Epic', color: '#8847ff', sellPrice: 50 },
    legendary: { name: 'Legendary', color: '#d32ce6', sellPrice: 150 },
    arcane: { name: 'Arcane', color: '#eb4b4b', sellPrice: 500 }
  };

  // База данных кейсов
  const casesData = {
    fable: {
      name: "Fable Case",
      price: 100,
      items: [
        { name: "P350 Neon", emo: "🔫", rarity: "rare" },
        { name: "G22 Nest", emo: "🔫", rarity: "rare" },
        { name: "M4 Lizard", emo: "🦅", rarity: "epic" },
        { name: "AKR Tiger", emo: "🐯", rarity: "legendary" },
        { name: "AWM Scratch", emo: "🎯", rarity: "arcane" }
      ]
    },
    scorpion: {
      name: "Scorpion Case",
      price: 120,
      items: [
        { name: "USP Genesis", emo: "🔥", rarity: "rare" },
        { name: "M40 Grizzly", emo: "🐻", rarity: "rare" },
        { name: "AKR Carbon", emo: "🖤", rarity: "epic" },
        { name: "Fabm Parrot", emo: "🦜", rarity: "legendary" },
        { name: "Karambit Claw", emo: "🔪", rarity: "arcane" }
      ]
    }
  };

  function updateBalanceDisplay() {
    document.getElementById('balanceValue').innerText = balance;
  }

  // Сохранение и восстановление прогресса (баланс + инвентарь), чтобы
  // переход между экранами и обновление страницы (F5) его не сбрасывали.
  function saveProgress() {
    try {
      localStorage.setItem('mifdrop_balance', JSON.stringify(balance));
      localStorage.setItem('mifdrop_inventory', JSON.stringify(myInventory));
    } catch (e) {
      // localStorage недоступен (приватный режим и т.п.) — просто не сохраняем
    }
  }

  function loadProgress() {
    try {
      const savedBalance = localStorage.getItem('mifdrop_balance');
      const savedInventory = localStorage.getItem('mifdrop_inventory');
      if (savedBalance !== null) balance = JSON.parse(savedBalance);
      if (savedInventory !== null) myInventory = JSON.parse(savedInventory);
    } catch (e) {
      // данные повреждены — продолжаем с значениями по умолчанию
    }
  }

  // Переключение экранов
  function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  // Если игрок уходит со страницы кейса, не нажав "Оставить" или "Продать",
  // выигранный предмет всё равно не теряется — он автоматически уходит в инвентарь.
  function autoResolvePendingWin() {
    if (currentWonSkin) {
      myInventory.push(currentWonSkin);
      currentWonSkin = null;
      saveProgress();
    }
  }

  function goToCatalog() {
    if (running || upgradeRunning) return;
    autoResolvePendingWin();
    switchScreen('catalogScreen');
  }

  function goToInventory() {
    if (running || upgradeRunning) return;
    autoResolvePendingWin();
    switchScreen('inventoryScreen');
    renderInventory();
  }

  function goToRoulette(caseKey) {
    if (running || upgradeRunning) return;
    autoResolvePendingWin();
    currentCase = casesData[caseKey];
    switchScreen('rouletteScreen');

    document.getElementById('caseTitle').innerText = currentCase.name;
    document.getElementById('spinArea').style.display = 'block';
    document.getElementById('winBox').style.display = 'none';

    const previewGrid = document.getElementById('previewGrid');
    previewGrid.innerHTML = '';
    currentCase.items.forEach(item => {
      const rMeta = rarityInfo[item.rarity];
      const color = rMeta.color;
      previewGrid.innerHTML += `
                <div class="preview-item" style="border-bottom-color: ${color}">
                    <div class="preview-icon">${item.emo}</div>
                    <div class="preview-name">${item.name}</div>
                    <div style="font-size: 0.65rem; color: #ffaa00; font-weight: 800; margin-top: 4px;">${rMeta.sellPrice} G</div>
                </div>
            `;
    });

    const track = document.getElementById('tapeTrack');
    track.style.transition = 'none';
    track.style.transform = 'translateX(0px)';
    track.innerHTML = '';
  }

  function spinRoulette() {
    if (running || !currentCase) return;
    if (balance < currentCase.price) {
      alert("Недостаточно баланса!");
      return;
    }

    balance -= currentCase.price;
    updateBalanceDisplay();
    saveProgress();
    running = true;

    const startBtn = document.getElementById('startBtn');
    startBtn.disabled = true;

    const track = document.getElementById('tapeTrack');
    track.style.transition = 'none';
    track.style.transform = 'translateX(0px)';
    track.innerHTML = '';

    const totalItemsCount = 70;
    const itemsList = [];
    for (let i = 0; i < totalItemsCount; i++) {
      const randomItem = currentCase.items[Math.floor(Math.random() * currentCase.items.length)];
      itemsList.push(randomItem);
    }

    const prizeIndex = 29;

    itemsList.forEach((item) => {
      const color = rarityInfo[item.rarity].color;
      const div = document.createElement('div');
      div.className = 'tape-item';
      div.style.borderBottomColor = color;
      div.innerHTML = `<span>${item.emo}</span>`;
      div.dataset.name = item.name;
      div.dataset.emo = item.emo;
      div.dataset.rarity = item.rarity;
      track.appendChild(div);
    });

    const itemWidth = 76 + 6;
    const windowWidth = document.querySelector('.tape-window').offsetWidth;
    const targetLeft = -((prizeIndex * itemWidth) - (windowWidth / 2) + (itemWidth / 2));

    setTimeout(() => {
      track.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)';
      track.style.transform = `translateX(${targetLeft}px)`;
    }, 50);

    setTimeout(() => {
      const winningItem = track.children[prizeIndex];
      const rarityKey = winningItem.dataset.rarity;
      const rMeta = rarityInfo[rarityKey];

      currentWonSkin = {
        name: winningItem.dataset.name,
        emo: winningItem.dataset.emo,
        rarity: rarityKey
      };

      const winBox = document.getElementById('winBox');
      winBox.style.display = 'block';
      winBox.style.setProperty('--glow-color', rMeta.color);
      winBox.style.border = `1px solid ${rMeta.color}33`;
      winBox.style.background = `radial-gradient(circle at center, ${rMeta.color}15 0%, #111726 100%)`;

      document.getElementById('spinArea').style.display = 'none';
      document.getElementById('winIcon').innerText = winningItem.dataset.emo;
      document.getElementById('winTitle').innerText = winningItem.dataset.name;

      const txtRarity = document.getElementById('winRarity');
      txtRarity.innerText = rMeta.name;
      txtRarity.style.color = rMeta.color;

      document.getElementById('sellBtn').innerText = `Продать за ${rMeta.sellPrice} G`;

      startBtn.disabled = false;
      running = false;
    }, 4100);
  }

  function sellCurrentSkin() {
    if (running || !currentWonSkin) return;
    const price = rarityInfo[currentWonSkin.rarity].sellPrice;
    balance += price;
    updateBalanceDisplay();
    currentWonSkin = null;
    saveProgress();
    goToCatalog();
  }

  function keepCurrentSkin() {
    if (running || !currentWonSkin) return;
    myInventory.push(currentWonSkin);
    currentWonSkin = null;
    saveProgress();
    goToInventory();
  }

  function renderInventory() {
    const container = document.getElementById('inventoryContent');
    if (myInventory.length === 0) {
      container.innerHTML = '<div class="inventory-empty-text">Ваш инвентарь пуст. Откройте кейсы, чтобы выбить скины!</div>';
      return;
    }

    let html = '<div class="inventory-grid">';
    myInventory.forEach((item, index) => {
      const rMeta = rarityInfo[item.rarity];
      const color = rMeta.color;
      html += `
                <div class="preview-item" style="border-bottom-color: ${color}; padding: 12px 6px;">
                    <div class="preview-icon" style="font-size: 1.8rem;">${item.emo}</div>
                    <div class="preview-name" style="font-size: 0.75rem;">${item.name}</div>
                    <div style="font-size: 0.65rem; color: ${color}; font-weight: bold; text-transform: uppercase; margin-top: 4px;">${rMeta.name}</div>
                    <button class="inv-sell-btn" onclick="sellFromInventory(${index})">Продать: ${rMeta.sellPrice}G</button>
                </div>
            `;
    });
    html += '</div>';
    container.innerHTML = html;
  }

  // Функция продажи предмета прямо из инвентаря
  function sellFromInventory(index) {
    const item = myInventory[index];
    const price = rarityInfo[item.rarity].sellPrice;

    balance += price; // Начисляем золото на баланс
    updateBalanceDisplay(); // Обновляем баланс в шапке сайта

    myInventory.splice(index, 1); // Удаляем предмет из инвентаря по индексу
    saveProgress();
    renderInventory(); // Перерисовываем обновленный инвентарь
  }

  // ========================= АПГРЕЙД =========================
  // Собираем единый список всех предметов из всех кейсов (без повторов по имени)
  function getAllItems() {
    const seen = new Set();
    const list = [];
    Object.values(casesData).forEach(c => {
      c.items.forEach(it => {
        if (!seen.has(it.name)) {
          seen.add(it.name);
          list.push(it);
        }
      });
    });
    return list;
  }

  function itemPrice(item) {
    return rarityInfo[item.rarity].sellPrice;
  }

  function goToUpgrade() {
    if (running || upgradeRunning) return;
    autoResolvePendingWin();
    switchScreen('upgradeScreen');
    upgradeSourceIndex = null;
    upgradeSourceItem = null;
    upgradeTargetItem = null;
    renderUpgradeStep1();
  }

  // Шаг 1: выбор своего предмета из инвентаря
  function renderUpgradeStep1() {
    const box = document.getElementById('upgradeContent');
    if (myInventory.length === 0) {
      box.innerHTML = '<div class="inventory-empty-text">Нужен хотя бы один предмет в инвентаре. Откройте кейс и оставьте предмет себе!</div>';
      return;
    }

    let html = '<div class="preview-title">Шаг 1. Выберите предмет для апгрейда</div><div class="inventory-grid">';
    myInventory.forEach((item, index) => {
      const rMeta = rarityInfo[item.rarity];
      html += `
                <div class="preview-item upg-pick-item" style="border-bottom-color:${rMeta.color}" onclick="selectUpgradeSource(${index})">
                    <div class="preview-icon">${item.emo}</div>
                    <div class="preview-name">${item.name}</div>
                    <div style="font-size: 0.65rem; color: ${rMeta.color}; font-weight: 800; margin-top: 4px;">${rMeta.sellPrice} G</div>
                </div>
            `;
    });
    html += '</div>';
    box.innerHTML = html;
  }

  function selectUpgradeSource(index) {
    upgradeSourceIndex = index;
    upgradeSourceItem = myInventory[index];
    renderUpgradeStep2();
  }

  // Шаг 2: выбор желаемого предмета (дороже исходного)
  function renderUpgradeStep2() {
    const box = document.getElementById('upgradeContent');
    const sourcePrice = itemPrice(upgradeSourceItem);
    const targets = getAllItems().filter(it => itemPrice(it) > sourcePrice);

    let html = '<div class="preview-title upg-back-link" onclick="renderUpgradeStep1()">← Выбрать другой предмет</div>';

    if (targets.length === 0) {
      html += '<div class="inventory-empty-text">Это максимальная редкость — апгрейдить дальше некуда.</div>';
      box.innerHTML = html;
      return;
    }

    html += '<div class="preview-title">Шаг 2. Выберите, что хотите получить</div><div class="inventory-grid">';
    targets.forEach(item => {
      const rMeta = rarityInfo[item.rarity];
      html += `
                <div class="preview-item upg-pick-item" style="border-bottom-color:${rMeta.color}" onclick="selectUpgradeTarget('${item.name}')">
                    <div class="preview-icon">${item.emo}</div>
                    <div class="preview-name">${item.name}</div>
                    <div style="font-size: 0.65rem; color: ${rMeta.color}; font-weight: 800; margin-top: 4px;">${rMeta.sellPrice} G</div>
                </div>
            `;
    });
    html += '</div>';
    box.innerHTML = html;
  }

  function selectUpgradeTarget(name) {
    upgradeTargetItem = getAllItems().find(it => it.name === name);
    renderUpgradeConfirm();
  }

  // Шаг 3: подтверждение — показываем шанс, множитель и шкалу апгрейда
  function renderUpgradeConfirm() {
    const box = document.getElementById('upgradeContent');
    const sourcePrice = itemPrice(upgradeSourceItem);
    const targetPrice = itemPrice(upgradeTargetItem);
    const chance = Math.max(2, Math.min(95, Math.round((sourcePrice / targetPrice) * 100 * HOUSE_EDGE)));
    const multiplier = (targetPrice / sourcePrice).toFixed(2);
    currentUpgradeChance = chance;

    const srcColor = rarityInfo[upgradeSourceItem.rarity].color;
    const tgtColor = rarityInfo[upgradeTargetItem.rarity].color;

    const html = `
      <div class="preview-title upg-back-link" onclick="renderUpgradeStep2()">← Выбрать другую цель</div>
      <div class="upgrade-compare">
        <div class="upgrade-slot" style="border-bottom-color:${srcColor}">
          <div class="upgrade-slot-icon">${upgradeSourceItem.emo}</div>
          <div class="upgrade-slot-name">${upgradeSourceItem.name}</div>
          <div class="upgrade-slot-price" style="color:${srcColor}">${sourcePrice} G</div>
        </div>
        <div class="upgrade-arrow-block">
          <span class="upgrade-arrow">→</span>
          <span class="upgrade-multiplier">x${multiplier}</span>
          <span class="upgrade-chance">${chance}% шанс</span>
        </div>
        <div class="upgrade-slot" style="border-bottom-color:${tgtColor}">
          <div class="upgrade-slot-icon">${upgradeTargetItem.emo}</div>
          <div class="upgrade-slot-name">${upgradeTargetItem.name}</div>
          <div class="upgrade-slot-price" style="color:${tgtColor}">${targetPrice} G</div>
        </div>
      </div>
      <div class="upgrade-meter" id="upgradeMeter">
        <div class="upgrade-meter-win" style="width:${chance}%"></div>
        <div class="upgrade-meter-lose"></div>
        <div class="upgrade-needle" id="upgradeNeedle"></div>
      </div>
      <button class="open-btn" id="upgradeStartBtn" onclick="startUpgrade()">Улучшить</button>
    `;
    box.innerHTML = html;
  }

  function startUpgrade() {
    if (upgradeRunning) return;
    upgradeRunning = true;

    const btn = document.getElementById('upgradeStartBtn');
    btn.disabled = true;

    const needle = document.getElementById('upgradeNeedle');
    needle.style.transition = 'none';
    needle.style.left = '50%';

    // Результат определяется один раз, здесь же — шанс остаётся прежним.
    const roll = Math.random() * 100;
    const win = roll < currentUpgradeChance;

    // Стрелка несколько раз "мечется" туда-сюда по шкале для азарта
    // и только в конце плавно останавливается ровно на точке roll —
    // итог и шанс при этом не меняются, это чисто визуальный эффект.
    const jumps = [
      { pos: 82 + Math.random() * 13, dur: 0.45 },
      { pos: 5 + Math.random() * 12, dur: 0.42 },
      { pos: 78 + Math.random() * 17, dur: 0.4 },
      { pos: 8 + Math.random() * 15, dur: 0.37 },
      { pos: 60 + Math.random() * 25, dur: 0.34 },
      { pos: 15 + Math.random() * 20, dur: 0.32 },
      { pos: roll, dur: 1 }
    ];

    let delay = 50;
    jumps.forEach(step => {
      setTimeout(() => {
        needle.style.transition = `left ${step.dur}s cubic-bezier(0.3, 0, 0.3, 1)`;
        needle.style.left = step.pos.toFixed(2) + '%';
      }, delay);
      delay += step.dur * 1000;
    });

    setTimeout(() => {
      finishUpgrade(win);
    }, delay + 150);
  }

  function finishUpgrade(win) {
    upgradeRunning = false;

    // Исходный предмет в любом случае уходит из инвентаря
    myInventory.splice(upgradeSourceIndex, 1);
    if (win) {
      myInventory.push(upgradeTargetItem);
    }
    saveProgress();

    const box = document.getElementById('upgradeContent');
    const item = win ? upgradeTargetItem : upgradeSourceItem;
    const rMeta = rarityInfo[item.rarity];

    const html = win ? `
      <div class="win-box" style="display:block; border:1px solid ${rMeta.color}33; background: radial-gradient(circle at center, ${rMeta.color}15 0%, #111726 100%);">
        <div class="win-icon">${item.emo}</div>
        <div class="win-title">Апгрейд успешен!</div>
        <div class="win-rarity" style="color:${rMeta.color}">Вы получили: ${item.name}</div>
        <div class="win-actions">
          <button class="sell-btn" onclick="goToUpgrade()">Улучшить ещё</button>
          <button class="keep-btn" onclick="goToInventory()">В инвентарь</button>
        </div>
      </div>
    ` : `
      <div class="win-box" style="display:block; border:1px solid #64748b33; background: radial-gradient(circle at center, #64748b15 0%, #111726 100%);">
        <div class="win-icon">💀</div>
        <div class="win-title">Не повезло</div>
        <div class="win-rarity" style="color:#94a3b8">Предмет потерян</div>
        <div class="win-actions">
          <button class="sell-btn" onclick="goToUpgrade()">Попробовать снова</button>
          <button class="keep-btn" onclick="goToInventory()">В инвентарь</button>
        </div>
      </div>
    `;
    box.innerHTML = html;
  }

  // Восстанавливаем баланс и инвентарь при загрузке / обновлении страницы (F5)
  loadProgress();
  updateBalanceDisplay();
</script>
</body>
</html>
